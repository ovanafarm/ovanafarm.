      :root {
        --bg: #f7f5ef;
        --surface: #fffdf8;

        --text: #22251f;

        --line: #e7dfd1;

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background:

          linear-gradient(315deg, rgba(185, 137, 69, .12), transparent 28%),

        color: var(--text);

      }

      a { color: inherit; }

        z-index: 1040;

        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 22px 16px;
        overflow-y: auto;
        background: #263528;
        color: #fff;
        transition: transform .25s ease;
      }

        color: #fff;

        flex: 0 0 42px;
        border-radius: 50%;

      }

        font-size: 18px;
        font-weight: 700;
      }

        display: none;
        object-fit: cover;
        background: #fff;
