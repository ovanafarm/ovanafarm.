<!DOCTYPE html>
<html>
<head>
    <title>Trash - Ovana Farm</title>
</head>
<body>

<h2>Trash</h2>

<table border="1">
    <thead>
        <tr>
          <th>Data</th>
          <th>Tanggal Hapus</th>
          <th>Aksi</th>
        </tr>
        
    </thead>
    <tbody id="trashTable"></tbody>
</table>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dyholzqyltspnpbjkpsn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5dQRwThjCNLnL-Zsr6Jbig_bA3OrGf6";

window.ovanaSupabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadTrash() {

  const { data, error } =
    await window.ovanaSupabase
      .from("trash")
      .select("*")
      .order("id", { ascending: false });

  if(error){
    console.error(error);
    return;
  }

  const tbody =
    document.getElementById("trashTable");

  tbody.innerHTML = "";

  data.forEach(item => {

    let namaData = "-";

    if(item.source === "barang"){
      namaData =
        item.data_json.nama || "-";
    }

    if(item.source === "pengeluaran"){
      namaData =
        item.data_json.keterangan || "-";
    }

    if(item.source === "penjualan"){
      namaData =
        (item.data_json.item || []).length +
        " Item";
    }

    tbody.innerHTML += `
      <tr>

        <td>
          ${item.source}
          <br>
          <small>${namaData}</small>
        </td>

        <td>
          ${new Date(
            item.deleted_at
          ).toLocaleString("id-ID")}
        </td>

        <td>

          <button
            onclick="restoreItem(${item.id})">

            ♻️ Restore

          </button>

          <button
            onclick="hapusPermanen(${item.id})">

            ❌ Hapus

          </button>

        </td>

      </tr>
    `;

  });

}

loadTrash();

    async function hapusPermanen(id){

  if(!confirm("Hapus permanen?"))
    return;

  await window.ovanaSupabase
    .from("trash")
    .delete()
    .eq("id", id);

  loadTrash();

}

async function restoreItem(id){

  alert(
    "Fitur restore akan dibuat berikutnya"
  );

}
    
</script>

</body>
</html>
