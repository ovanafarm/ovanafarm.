<!DOCTYPE html>
<html>
<head>
    <title>Trash - Ovana Farm</title>
</head>
<body>

<div class="card">

  <div class="card-header">

    <h3 class="card-title">
      🗑️ Trash
      <span id="jumlahTrash"
            class="badge bg-danger ms-2">
        0
      </span>
    </h3>

  </div>

    <div class="card-body">

  <div class="mb-3">

    <input
      type="text"
      id="searchTrash"
      class="form-control"
      placeholder="Cari data..."
      onkeyup="loadTrash()">

  </div>

  <table class="table table-bordered table-striped">

    <thead>
      <tr>
        <th>Jenis</th>
        <th>Data</th>
        <th>Tanggal Hapus</th>
        <th>Aksi</th>
      </tr>
    </thead>

    <tbody id="trashTable"></tbody>

  </table>

</div>

</div>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dyholzqyltspnpbjkpsn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5dQRwThjCNLnL-Zsr6Jbig_bA3OrGf6";

window.ovanaSupabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadTrash() {

  const { data, error } =
    await window.ovanaSupabase
      .from("trash")
      .select("*")
      .order("id", { ascending: false });

  if(error){
    console.error(error);
    return;
  }

  const tbody =
    document.getElementById("trashTable");

  tbody.innerHTML = "";

document.getElementById(
  "jumlahTrash"
).innerText = data.length;

const keyword =
  document
    .getElementById("searchTrash")
    .value
    .toLowerCase();

data.forEach(item => {

  let namaData = "-";
      
    if(item.source === "barang"){
      namaData =
        item.data_json.nama || "-";
    }

    if(item.source === "pengeluaran"){
      namaData =
        item.data_json.keterangan || "-";
    }

    if(item.source === "penjualan"){
      namaData =
        (item.data_json.item || []).length +
        " Item";
    }

      let badge = "";

if(item.source === "barang"){
  badge =
    '<span class="badge bg-success">Barang</span>';
}

if(item.source === "penjualan"){
  badge =
    '<span class="badge bg-primary">Penjualan</span>';
}

if(item.source === "pengeluaran"){
  badge =
    '<span class="badge bg-warning text-dark">Pengeluaran</span>';
}

      if(
  keyword &&
  !namaData
    .toLowerCase()
    .includes(keyword)
){
  return;
}

      tbody.innerHTML += `
<tr>

  <td>${badge}</td>

  <td>${namaData}</td>

  <td>
    ${new Date(
      item.deleted_at
    ).toLocaleString("id-ID")}
  </td>

  <td>

    <button
      class="btn btn-success btn-sm"
      onclick="restoreItem(${item.id})">

      ♻️

    </button>

    <button
      class="btn btn-danger btn-sm"
      onclick="hapusPermanen(${item.id})">

      ❌

    </button>

  </td>

</tr>
`;
      

  });

}

loadTrash();

    async function hapusPermanen(id){

  if(!confirm("Hapus permanen?"))
    return;

  await window.ovanaSupabase
    .from("trash")
    .delete()
    .eq("id", id);

  loadTrash();

}

async function restoreItem(id){

  const { data:item, error } =
    await window.ovanaSupabase
      .from("trash")
      .select("*")
      .eq("id", id)
      .single();

  if(error){
    console.error(error);
    return;
  }

  let dataRestore =
    item.data_json;

  delete dataRestore.id;

  // BARANG
  if(item.source === "barang"){

    await window.ovanaSupabase
      .from("barang")
      .insert([dataRestore]);

  }

  // PENJUALAN
  else if(item.source === "penjualan"){

    await window.ovanaSupabase
      .from("penjualan")
      .insert([dataRestore]);

  }

  // PENGELUARAN
  else if(item.source === "pengeluaran"){

    await window.ovanaSupabase
      .from("pengeluaran")
      .insert([dataRestore]);

  }

  // hapus dari trash
  await window.ovanaSupabase
    .from("trash")
    .delete()
    .eq("id", id);

  alert("Data berhasil direstore");

  loadTrash();

}
    
</script>

</body>
</html>
