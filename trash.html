<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trash - Ovana Farm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
      body { background: #f5f6f8; }
      .app-shell { min-height: 100vh; display: grid; grid-template-columns: 230px 1fr; }
      .sidebar { background: #2f363d; color: #fff; padding: 18px 14px; }
      .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; margin-bottom: 28px; }
      .brand img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
      .nav-link { color: rgba(255,255,255,.78); border-radius: 6px; margin-bottom: 4px; }
      .nav-link:hover, .nav-link.active { color: #fff; background: rgba(255,255,255,.12); }
      .content { padding: 24px; }
      .toolbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
      .card, .table { border-radius: 8px; }
      .item-img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; background: #e9ecef; }
      .muted-small { color: #6c757d; font-size: 13px; }
      @media (max-width: 900px) {
        .app-shell { grid-template-columns: 1fr; }
        .sidebar { display: none; }
        .toolbar { align-items: stretch; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="./index.html">
          <img class="brand-image" src="./assets/img/AdminLTELogo.png" alt="Logo">
          <span class="brand-text">Ovana Farm</span>
        </a>

        <nav class="nav flex-column">
          <a class="nav-link" href="./index.html"><i class="bi bi-speedometer me-2"></i>Laporan Penjualan</a>
          <a class="nav-link" href="./dashboard-kasir.html"><i class="bi bi-box-seam me-2"></i>Management Stock</a>
          <a class="nav-link" href="./transaksi-kasir.html"><i class="bi bi-cart-fill me-2"></i>Kasir</a>
          <a class="nav-link" href="./riwayat-penjualan.html"><i class="bi bi-clock-history me-2"></i>Riwayat Penjualan</a>
          <a class="nav-link" href="./pengeluaran.html"><i class="bi bi-cash-stack me-2"></i>Pengeluaran</a>
          <a class="nav-link active" href="./trash.html"><i class="bi bi-trash me-2"></i>Trash</a>
          <a class="nav-link" href="./stock-record.html"><i class="bi bi-clipboard-data me-2"></i>Stock Record</a>
          <a class="nav-link" href="./setting.html"><i class="bi bi-gear-fill me-2"></i>Setting</a>
        </nav>
      </aside>

      <main class="content">
        <div class="toolbar">
          <div>
            <h3 class="mb-1">Trash</h3>
            <div class="muted-small">Data yang dihapus dari management stock bisa direstore dari sini.</div>
          </div>

          <div class="input-group" style="max-width: 360px;">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input
              type="text"
              id="searchTrash"
              class="form-control"
              placeholder="Cari barang..."
              oninput="tampilkanTrash()">
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>Barang</th>
                    <th>Source</th>
                    <th>Stock</th>
                    <th>Dihapus</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="tabelTrash">
                  <tr>
                    <td colspan="5" class="text-center text-muted py-4">
                      Memuat trash...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://dyholzqyltspnpbjkpsn.supabase.co";
      const SUPABASE_KEY = "sb_publishable_5dQRwThjCNLnL-Zsr6Jbig_bA3OrGf6";

      window.ovanaSupabase =
        window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      let trashData = [];

      function parseQty(value) {
        const qty = parseFloat(String(value || "0").replace(",", "."));
        if (Number.isNaN(qty)) return 0;
        return Math.round(qty * 1000) / 1000;
      }

      function formatQty(value, satuan = "pcs") {
        const qty = parseQty(value);
        return satuan === "kg" ? qty.toFixed(3) : String(Math.round(qty));
      }

      function mapBarangToDb(data) {
        return {
          gambar: data.gambar || "",
          nama: data.nama || "",
          harga_beli: data.harga_beli ?? data.modal ?? 0,
          harga_jual: data.harga_jual ?? data.hargaJual ?? 0,
          harga_grosir: data.harga_grosir ?? data.hargaGrosir ?? 0,
          min_grosir: data.min_grosir ?? data.minGrosir ?? 0,
          satuan: data.satuan || "pcs",
          stock: data.stock ?? 0,
          minimum_stock: data.minimum_stock ?? data.minimumStock ?? 0
        };
      }

      async function getCurrentUserName() {
        const { data } =
          await window.ovanaSupabase
            .from("setting")
            .select("nama_user")
            .eq("id", 1)
            .single();

        return data?.nama_user || "Admin";
      }

      async function simpanStockLog(action, barangId, namaBarang, beforeData, afterData, catatan) {
        const userName = await getCurrentUserName();

        await window.ovanaSupabase
          .from("stock_logs")
          .insert([
            {
              action,
              barang_id: barangId,
              nama_barang: namaBarang,
              before_data: beforeData,
              after_data: afterData,
              catatan,
              user_name: userName
            }
          ]);
      }

      function tampilkanTrash() {
        const tbody = document.getElementById("tabelTrash");
        const keyword = document.getElementById("searchTrash").value.toLowerCase();

        const filtered = trashData.filter((item) => {
          const data = item.data_json || {};
          return (data.nama || "").toLowerCase().includes(keyword);
        });

        if (filtered.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="text-center text-muted py-4">
                Trash kosong
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = filtered.map((item) => {
          const data = item.data_json || {};
          const satuan = data.satuan || "pcs";
          const tanggal = item.deleted_at
            ? new Date(item.deleted_at).toLocaleString("id-ID")
            : "-";

          return `
            <tr>
              <td>
                <div class="d-flex align-items-center gap-3">
                  <img class="item-img" src="${data.gambar || "./assets/img/AdminLTELogo.png"}" alt="">
                  <div>
                    <div class="fw-semibold">${data.nama || "-"}</div>
                    <div class="muted-small">ID lama: ${item.original_id || "-"}</div>
                  </div>
                </div>
              </td>
              <td>${item.source}</td>
              <td>${formatQty(data.stock, satuan)} ${satuan}</td>
              <td>${tanggal}</td>
              <td class="text-end">
                <button class="btn btn-sm btn-success" onclick="restoreTrash(${item.id})">
                  <i class="bi bi-arrow-counterclockwise"></i> Restore
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="hapusPermanen(${item.id})">
                  <i class="bi bi-x-circle"></i> Hapus
                </button>
              </td>
            </tr>
          `;
        }).join("");
      }

      async function loadTrash() {
        const { data, error } =
          await window.ovanaSupabase
            .from("trash")
            .select("*")
            .order("deleted_at", { ascending: false });

        if (error) {
          console.error(error);
          alert("Gagal memuat trash");
          return;
        }

        trashData = data || [];
        tampilkanTrash();
      }

      async function restoreTrash(id) {
        const item = trashData.find((row) => row.id === id);
        if (!item) return;

        if (!confirm("Restore barang ini ke management stock?")) return;

        const dataJson = item.data_json || {};

        if (item.source !== "barang") {
          alert("Restore untuk source ini belum tersedia.");
          return;
        }

        const barangDb = mapBarangToDb(dataJson);

        const { data: inserted, error: insertError } =
          await window.ovanaSupabase
            .from("barang")
            .insert([barangDb])
            .select("*")
            .single();

        if (insertError) {
          console.error(insertError);
          alert("Restore gagal");
          return;
        }

        await window.ovanaSupabase
          .from("trash")
          .delete()
          .eq("id", id);

        await simpanStockLog(
          "RESTORE_FROM_TRASH",
          inserted.id,
          inserted.nama,
          null,
          inserted,
          "Barang direstore dari trash"
        );

        alert("Barang berhasil direstore");
        loadTrash();
      }

      async function hapusPermanen(id) {
        if (!confirm("Hapus permanen dari trash? Data tidak bisa direstore.")) return;

        const { error } =
          await window.ovanaSupabase
            .from("trash")
            .delete()
            .eq("id", id);

        if (error) {
          console.error(error);
          alert("Gagal hapus permanen");
          return;
        }

        loadTrash();
      }

      loadTrash();
    </script>
  </body>
</html>
