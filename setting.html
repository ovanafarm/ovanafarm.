  <script>

    async function loadSettingSupabase() {

    function loadSetting() {

        localStorage.getItem("namaToko") || "Ovana Farm";

      document.getElementById("alamatToko").value =
        localStorage.getItem("alamatToko") || "";

      document.getElementById("nomorToko").value =
        localStorage.getItem("nomorToko") || "";

      document.getElementById("saldoAwal").value =
        localStorage.getItem("saldoAwal") || 0;

      document.getElementById("targetPenjualan").value =
        localStorage.getItem("targetPenjualan") || 1000000;

      document.getElementById("targetProfit").value =
        localStorage.getItem("targetProfit") || 100000;
        
        document.getElementById("namaUser").value =
      localStorage.getItem("namaUser") || "Admin";

      const fotoUser =
  localStorage.getItem("fotoUser");

if (fotoUser) {

  document.getElementById(
    "previewFotoUser"
  ).src = fotoUser;

}
      
      const namaToko = localStorage.getItem("namaToko");
      if (namaToko) {
        document.getElementById("sidebarNamaToko").innerText = namaToko;
      }

     const logoToko = localStorage.getItem("logoToko");

if (logoToko) {

  document.querySelector(
    ".brand-image"
  ).src = logoToko;

  document.getElementById(
    "previewLogoToko"
  ).src = logoToko;

}
    }

    function simpanSetting() {
      localStorage.setItem("namaToko", document.getElementById("namaToko").value);
      localStorage.setItem("alamatToko", document.getElementById("alamatToko").value);
      localStorage.setItem("nomorToko", document.getElementById("nomorToko").value);
      localStorage.setItem("saldoAwal", document.getElementById("saldoAwal").value || 0);
      localStorage.setItem("targetPenjualan", document.getElementById("targetPenjualan").value || 1000000);
      localStorage.setItem("targetProfit", document.getElementById("targetProfit").value || 100000);
      localStorage.setItem(
  "namaUser",
  document.getElementById("namaUser").value
);
      const file = document.getElementById("logoTokoInput").files[0];
const fotoUser =
  document.getElementById("fotoUserInput").files[0];

if (fotoUser) {

  const readerUser = new FileReader();

  readerUser.onload = function(event) {

    localStorage.setItem(
      "fotoUser",
      event.target.result
    );

  };

  readerUser.readAsDataURL(fotoUser);

}

if (file) {

  const reader = new FileReader();

  reader.onload = function(event) {

    localStorage.setItem(
      "logoToko",
      event.target.result
    );

    document.querySelector(
      ".brand-image"
    ).src = event.target.result;

    alert("Setting berhasil disimpan.");

  };

  reader.readAsDataURL(file);

} else {

  alert("Setting berhasil disimpan.");

}
      document.getElementById("sidebarNamaToko").innerText =
        document.getElementById("namaToko").value || "Ovana Farm";
    }

document.getElementById(

).addEventListener("change", function() {

  const reader = new FileReader();

  reader.onload = function(e) {

      "previewFotoUser"

  reader.readAsDataURL(file);

});

document.getElementById(
  "logoTokoInput"
).addEventListener("change", function() {

  const reader = new FileReader();

  reader.onload = function(e) {

    document.getElementById(
      "previewLogoToko"
    ).src = e.target.result;

  };

  reader.readAsDataURL(file);

});

<script>

function loadNotifikasi() {

  let notifikasi = [];

  let barang =
    JSON.parse(localStorage.getItem("barang"))
    || [];

  barang.forEach((item) => {

    if (item.stock <= item.minimumStock) {

      notifikasi.push(
        `⚠ ${item.nama} stok tersisa ${item.stock}`
      );

    }

  });

  document.getElementById("jumlahNotifikasi").innerText =
    notifikasi.length;

  document.getElementById("judulNotifikasi").innerText =
    notifikasi.length + " Notifikasi";

  let html = "";

  notifikasi.forEach((item) => {

    html += `
      <a href="./dashboard-kasir.html"
         class="dropdown-item text-danger fw-bold">
        ${item}
      </a>
      <div class="dropdown-divider"></div>
    `;

  });

  if (notifikasi.length === 0) {

    html = `
      <a href="#" class="dropdown-item">
        Tidak ada notifikasi 🎉
      </a>
    `;

  }

  document.getElementById("listNotifikasi").innerHTML =
    html;

}

loadNotifikasi();

</script>
