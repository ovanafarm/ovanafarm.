<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Management Stock - Ovana Farm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" integrity="sha256-tXJfXfp6Ewt1ilPzLDtQnJV4hclT9XuaZUKyUvmyr+Q=" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
      :root {
        --app-bg: #f6f7f9;
        --sidebar-bg: #242b31;
        --sidebar-hover: rgba(255, 255, 255, .11);
        --line: #e7eaee;
        --text: #1f2933;
      }

      * { box-sizing: border-box; }
      body {
        background: var(--app-bg);
        color: var(--text);
        font-family: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
      }

      .sidebar {
        width: 230px;
        background: var(--sidebar-bg);
        color: #fff;
        padding: 18px 14px;
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        z-index: 1040;
        transition: transform .2s ease;
        overflow-y: auto;
      }

      .sidebar.collapsed { transform: translateX(-230px); }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        text-decoration: none;
        margin-bottom: 28px;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: 0 0 38px;
        background: linear-gradient(135deg, #3f8f5f, #f4b942);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22);
        overflow: hidden;
      }

      .brand-logo img,
      .user-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .brand-text {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .sidebar .nav-link {
        color: rgba(255, 255, 255, .78);
        border-radius: 6px;
        margin-bottom: 4px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        color: #fff;
        background: var(--sidebar-hover);
      }

      .sidebar .nav-link i { font-size: 16px; }
      .sidebar-bottom { margin-top: auto; padding-top: 16px; }

        position: fixed;
